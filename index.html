<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="fiap-build" content="0011"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIAP Collections Service</title>
<style>
:root{color-scheme:dark;--bg:#080f1c;--panel:#111e31;--line:#293c55;--muted:#acbad0;--gold:#dfbc77}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#1c3554,transparent 60%),var(--bg);color:#f4f6fa;font:16px/1.6 system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}header,main,footer{max-width:1240px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:750;letter-spacing:.05em}.tag{font-size:12px;letter-spacing:.15em;border:1px solid var(--gold);color:var(--gold);padding:5px 12px;border-radius:30px}.intro{padding:35px 0 25px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.2em;font-size:12px}h1{font-size:clamp(32px,5vw,54px);line-height:1.1;margin:12px 0}p{color:var(--muted)}.notice{padding:15px 20px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;background:#14243a}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:25px 0}.tools input{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;color:white}.btn{background:#e0bd79;color:#172033;border:0;border-radius:8px;padding:12px 18px;font-weight:650}.secondary{background:var(--panel);color:white;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{text-align:left;padding:24px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#192a42,#101c2d);color:white;min-height:150px;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:var(--gold)}.card small{color:var(--gold);font-size:12px}.card h2{font-size:21px;margin:12px 0 4px}.card p{margin:0;font-size:14px}.count{font-size:13px;color:var(--muted)}footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:35px}dialog{width:min(1050px,96vw);max-height:94vh;border:1px solid var(--line);border-radius:14px;background:#0e192a;color:white;padding:0}dialog::backdrop{background:#000c}.dialoghead{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}.dialoghead h2{font-size:19px;margin:0;overflow-wrap:anywhere}.content{padding:22px}.viewer{height:65vh;display:flex;align-items:center;justify-content:center;background:#050a12;overflow:auto}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer iframe{width:100%;height:100%;border:0;background:white}.viewer pre{white-space:pre-wrap;overflow-wrap:anywhere;align-self:start;padding:20px;width:100%;color:white}.filelist{display:grid;gap:8px;margin:15px 0}.filelist button{text-align:left}.empty{text-align:center;padding:30px}.empty h3{color:white}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr}header,main,footer{padding:18px}.brand{font-size:18px}.tools .btn{width:100%}}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#folderPath{overflow-wrap:anywhere}#nasList{display:grid;gap:10px;margin:20px 0}.nasRow{display:flex;gap:18px;align-items:center;text-align:left;padding:12px;background:var(--panel);color:white;border:1px solid var(--line);border-radius:8px;min-height:90px}.nasRow span{overflow-wrap:anywhere}.thumb{width:96px;height:72px;object-fit:contain;flex-shrink:0;background:#080f1c;border-radius:5px}.fileIcon{width:96px;flex-shrink:0;text-align:center;font-size:28px}#previewStatus{padding:0 22px}button:disabled{opacity:.4;cursor:default}.collectionHeading{display:flex;align-items:center;gap:12px;min-width:0}.collectionHeading .fiapLogo{width:42px;height:42px;object-fit:contain;flex-shrink:0}.collectionHeading h2{min-width:0}
.headerTools{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.languagePicker{display:flex;gap:5px}.languagePicker button{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:white;padding:7px 10px}.languagePicker button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.brandGroup{display:flex;align-items:center;gap:15px}.brandLogo{width:64px;height:64px;object-fit:contain;flex-shrink:0}.heroLogo{width:100px;height:100px;object-fit:contain;float:right;margin:0 0 20px 24px}.intro h1{white-space:pre-line}@media(max-width:700px){header{flex-wrap:wrap;gap:18px}.headerTools{width:100%;justify-content:space-between}.brandLogo{width:48px;height:48px}.heroLogo{width:70px;height:70px}}
.buildVersion{margin-top:16px;color:var(--gold);font:600 12px/1.5 ui-monospace,monospace;letter-spacing:.08em}
.brandText{min-width:0}.brandSubtitle{margin-top:4px;color:var(--gold);font-size:11px;line-height:1.5;letter-spacing:.09em;text-transform:uppercase}
footer{text-align:center}
/* Build 0011: mobile layout and touch controls. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{touch-action:manipulation}
.brandGroup,.headerTools,.grid,.card,.content,.controls,.nasRow{min-width:0}
.card h2,.card p,.brand,.brandSubtitle{overflow-wrap:anywhere}
.nasRow>span:last-child{min-width:0;flex:1}
.dialoghead>button{flex-shrink:0}
@media(max-width:700px){
 header,main,footer{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
 header{align-items:flex-start;gap:16px;padding-top:18px;padding-bottom:16px}
 .brandGroup{width:100%;gap:12px;align-items:center}
 .brandLogo{width:48px;height:48px}
 .brand{font-size:clamp(17px,4.4vw,23px);line-height:1.25;letter-spacing:.02em}
 .brandSubtitle{font-size:10px;letter-spacing:.06em;line-height:1.5;margin-top:6px}
 .headerTools{width:100%;justify-content:flex-end}
 .languagePicker{gap:8px}
 .languagePicker button{min-width:64px;min-height:44px;padding:8px 11px}
 main{padding-top:16px;padding-bottom:16px}
 .grid{gap:12px}
 .card{padding:20px;min-height:136px}
 .card h2{font-size:20px;line-height:1.3;margin:12px 0 6px}
 .card p{font-size:14px;line-height:1.5}
 .count{margin-top:0}
 footer{margin-top:20px;padding-top:20px;padding-bottom:max(24px,env(safe-area-inset-bottom));font-size:12px;line-height:1.6}
 .btn{min-height:44px;padding:10px 14px}
 dialog{width:calc(100% - 16px);max-width:100%;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);margin:auto;border-radius:12px;overscroll-behavior:contain}
 .dialoghead{padding:12px;gap:10px;align-items:center}
 .dialoghead h2{font-size:16px;line-height:1.4}
 .collectionHeading{gap:8px}
 .collectionHeading .fiapLogo{width:32px;height:32px}
 .dialoghead .btn{font-size:14px;padding:9px 11px}
 .content{padding:14px}
 .controls{gap:10px}
 #folderPath{display:block;flex-basis:100%;font-size:14px;line-height:1.5}
 #status{font-size:14px;line-height:1.5}
 #nasList{gap:8px;margin:16px 0}
 .nasRow{gap:12px;padding:10px;min-height:78px;font-size:15px;line-height:1.4}
 .thumb{width:68px;height:56px}
 .fileIcon{width:68px;font-size:25px}
 .viewer{height:58vh;height:58dvh;min-height:160px}
 #previewStatus{padding:0 12px;font-size:14px}
 #position{font-size:14px;white-space:nowrap}
}
@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:360px){
 .brandLogo{width:42px;height:42px}.brandGroup{gap:10px}
 .brand{font-size:17px}.brandSubtitle{font-size:9px}
 .nasRow{gap:9px}.thumb{width:54px;height:50px}.fileIcon{width:54px}
}
@media(max-height:500px) and (orientation:landscape){.viewer{height:48vh;height:48dvh;min-height:100px}.dialoghead{padding-top:8px;padding-bottom:8px}}

/* Keep dialog headers inside Safari's visible viewport. */
dialog{
 position:fixed;top:var(--dialog-top,16px);bottom:auto;left:0;right:0;
 margin:0 auto;width:min(1050px,calc(100% - 24px));
 max-height:calc(100vh - 32px);max-height:var(--dialog-height,calc(100dvh - 32px));
 overflow:hidden;
}
dialog[open]{display:flex;flex-direction:column}
dialog>.dialoghead{flex:0 0 auto;background:#0e192a;position:relative;z-index:1;padding-top:18px;padding-bottom:18px}
dialog>.content{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dialoghead button:focus-visible{outline-offset:-3px}
#preview>.viewer{flex:1 1 auto;min-height:0;overflow:auto}
#previewStatus{flex-shrink:0}
@media(max-width:700px){
 dialog{width:calc(100% - 16px)}
 dialog>.dialoghead{padding:14px 12px}
}

.galleryControls{gap:8px}#filePosition{font-size:14px;white-space:nowrap}#pdfControls{border-top:1px solid var(--line)}

/* Build 0011: centred text and controls on phones. */
@media(max-width:700px){
 body,header,main,footer,dialog,button,input,.card,.filelist button,.nasRow{text-align:center}
 header{justify-content:center;align-items:center}
 .brandGroup{flex-direction:column;justify-content:center;align-items:center}
 .brandText{width:100%;text-align:center}
 .headerTools,.languagePicker,.controls,.collectionHeading{justify-content:center}
 .headerTools{align-items:center}
 .languagePicker{margin-inline:auto}
 .card{display:flex;flex-direction:column;align-items:center;justify-content:center}
 .card h2,.card p,.card small{width:100%;text-align:center}
 .dialoghead{justify-content:center;flex-wrap:wrap}
 .collectionHeading{flex:1 1 100%;min-width:0}
 .dialoghead h2{flex:1 1 100%;text-align:center}
 .collectionHeading h2{flex:0 1 auto}
 .dialoghead>button{margin-inline:auto}
 .nasRow{flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:14px}
 .nasRow>span:last-child{flex:0 1 auto;width:100%;text-align:center}
 .fileIcon{text-align:center}
 .btn,.languagePicker button{display:inline-flex;align-items:center;justify-content:center;text-align:center}
 #status,#folderPath,#previewStatus,#position,#filePosition,.count{text-align:center}
 #pdfControls,.galleryControls{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
 #pdfControls>button,.galleryControls>button{width:100%;margin:0;min-width:0}
}

</style>
</head>

Object.assign(translations.es,{prevFile:'← Anterior',nextFile:'Siguiente →',galleryError:'No se pudo cargar la lista completa. Cierra el visor y vuelve a intentarlo.'});
Object.assign(translations.en,{prevFile:'← Previous',nextFile:'Next →',galleryError:'Unable to load the complete file list. Close the viewer and try again.'});
Object.assign(translations.fr,{prevFile:'← Précédent',nextFile:'Suivant →',galleryError:'Impossible de charger la liste complète. Fermez le visualiseur et réessayez.'});
let lang='en';
try{const stored=localStorage.getItem('fiap-language');const browser=(navigator.language||'en').slice(0,2);lang=translations[stored]?stored:(translations[browser]?browser:'en')}catch(e){}
const t=key=>translations[lang][key]||key;
function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('search').placeholder=t('search');$('search').setAttribute('aria-label',t('search'));$('grid').setAttribute('aria-label',t('sections'));$('languages').setAttribute('aria-label',t('language'));$('previewImage').alt=t('preview');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));render()}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('fiap-language',lang)}catch(e){}applyLanguage()});

function render(){const term=normalize($('search').value);$('grid').replaceChildren();let count=0;collections.forEach(([name,desc,path],i)=>{name=collectionNames[lang]?.[i]||name;desc=descriptions[lang][i];if(!normalize(name+' '+desc).includes(term))return;count++;const b=document.createElement('button');b.className='card';const small=document.createElement('small');small.textContent=String(i+1).padStart(2,'0')+' / '+(path===null?t('soon'):t('collection'));const h=document.createElement('h2');h.textContent=name;const p=document.createElement('p');p.textContent=desc;b.append(small,h,p);b.onclick=()=>enter(name,path);$('grid').append(b)});$('count').textContent=count+' '+t('sections');$('noResults').classList.toggle('hidden',count>0)}
async function enter(name,path){const entry=++enterVersion;browseVersion++;if(observer)observer.disconnect();queue.length=0;folder=path||'';offset=0;$('folderPath').textContent=path||t('root');$('nasList').replaceChildren();$('retry').classList.add('hidden');$('status').textContent=t('connecting');$('up').disabled=true;$('before').disabled=$('after').disabled=true;$('collectionTitle').textContent=name;$('collection').showModal();if(path===null){$('nasList').replaceChildren();$('status').textContent=t('pending');$('up').disabled=true;$('before').disabled=$('after').disabled=true;return}if(path){try{if(!rootItems)rootItems=(await api('/api/list')).items;if(entry!==enterVersion)return;const found=rootItems.find(x=>x.kind==='folder'&&normalize(x.name)===normalize(path));if(!found){await browse('');$('status').textContent=t('missing');return}path=found.path}catch(e){if(entry!==enterVersion)return;folder=path;$('status').textContent=e.message;$('retry').classList.remove('hidden');return}}if(entry===enterVersion)browse(path)}
async function browse(path='',start=0){const ticket=++browseVersion;folder=path;offset=start;if(observer)observer.disconnect();queue.length=0;$('nasList').replaceChildren();$('folderPath').textContent=path||t('root');$('status').textContent=t('reading');$('retry').classList.add('hidden');$('before').disabled=$('after').disabled=true;$('up').disabled=!path;try{const d=await api('/api/list?path='+encodeURIComponent(path)+'&offset='+start);if(ticket!==browseVersion)return;folderItems=d.items;observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){observer.unobserve(e.target);queue.push({img:e.target,url:e.target.dataset.url})}pump()},{root:$('collection'),rootMargin:'100px'});for(const item of d.items){const b=document.createElement('button');b.className='nasRow';const label=document.createElement('span');label.textContent=item.name;let img;if(['image','pdf'].includes(item.kind)){img=document.createElement('img');img.className='thumb';img.alt=item.kind==='pdf'?t('pdfThumb'):t('thumb');img.dataset.url=API+'/api/thumb?path='+encodeURIComponent(item.path);b.append(img)}else{const icon=document.createElement('span');icon.className='fileIcon';icon.textContent=item.kind==='folder'?'📁':'📄';b.append(icon)}b.append(label);b.onclick=()=>item.kind==='folder'?browse(item.path):item.kind==='unsupported'?($('status').textContent=t('unsupported')+item.name):openPreview(item);$('nasList').append(b);if(img)observer.observe(img)}$('status').textContent=d.total?(start+1)+'–'+Math.min(start+d.limit,d.total)+' '+t('of')+' '+d.total+' '+t('items'):t('empty');$('before').disabled=start===0;$('after').disabled=start+d.limit>=d.total}catch(e){if(ticket===browseVersion){$('status').textContent=e.message;$('retry').classList.remove('hidden')}}}
function updateFileNav(){
 $('prevFile').disabled=galleryIndex<=0;
 $('nextFile').disabled=galleryIndex<0||galleryIndex>=gallery.length-1;
 $('filePosition').textContent=galleryIndex<0?'':(galleryIndex+1)+' / '+gallery.length;
}
function selectFile(index){
 if(index<0||index>=gallery.length)return;
 galleryIndex=index;const item=gallery[index];file=item.path;
 $('filename').textContent=item.name;updateFileNav();preview(0);
}
async function openPreview(item){
 const ticket=++galleryVersion;const sourceFolder=folder;
 gallery=folderItems.filter(x=>x.kind==='image'||x.kind==='pdf');
 if(!gallery.some(x=>x.path===item.path))gallery=[item];
 $('preview').showModal();selectFile(gallery.findIndex(x=>x.path===item.path));
 // Fetch directory metadata only, including files beyond the first list page.
 try{
  let all=[],start=0;
  do{
   const d=await api('/api/list?path='+encodeURIComponent(sourceFolder)+'&offset='+start);
   if(ticket!==galleryVersion)return;
   all.push(...d.items.filter(x=>x.kind==='image'||x.kind==='pdf'));
   if(start+d.limit>=d.total)break;
   if(!d.limit||!d.items.length)throw Error(t('unexpected'));
   start+=d.limit;
  }while(true);
  if(ticket!==galleryVersion)return;
  const current=file;const found=all.findIndex(x=>x.path===current);
  if(found>=0){gallery=all;galleryIndex=found;updateFileNav()}
 }catch(e){if(ticket===galleryVersion)$('previewStatus').textContent=t('galleryError')}
}
async function preview(n){const ticket=++previewVersion;$('pdfControls').classList.add('hidden');$('previewStatus').textContent=t('generating');$('previewImage').removeAttribute('src');$('prev').disabled=$('next').disabled=true;$('position').textContent='';try{const d=await api('/api/preview?path='+encodeURIComponent(file)+'&page='+n);if(ticket!==previewVersion)return;page=d.page;pages=d.pages;$('pdfControls').classList.toggle('hidden',pages<=1);$('previewImage').src=d.image;$('position').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page+1>=pages;$('previewStatus').textContent=''}catch(e){if(ticket===previewVersion)$('previewStatus').textContent=e.message}}
$('prevFile').onclick=()=>selectFile(galleryIndex-1);$('nextFile').onclick=()=>selectFile(galleryIndex+1);
$('preview').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();selectFile(galleryIndex+1)}else if(e.key==='ArrowLeft'){e.preventDefault();selectFile(galleryIndex-1)}});
$('search').oninput=render;$('closeCollection').onclick=()=>$('collection').close();$('collection').onclose=()=>{enterVersion++;browseVersion++;if(observer)observer.disconnect();queue.length=0};$('closePreview').onclick=()=>$('preview').close();$('preview').onclose=()=>{galleryVersion++;previewVersion++;$('previewImage').removeAttribute('src')};$('prev').onclick=()=>preview(page-1);$('next').onclick=()=>preview(page+1);$('up').onclick=()=>browse(folder.split('/').slice(0,-1).join('/'));$('before').onclick=()=>browse(folder,Math.max(0,offset-100));$('after').onclick=()=>browse(folder,offset+100);$('retry').onclick=()=>browse(folder,offset);applyLanguage();
</script></body></html>
